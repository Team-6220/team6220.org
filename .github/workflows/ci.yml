name: CI

# Runs on every pull request. Branch protection requires the "ci" job to pass.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GoldSim keeps its own npm workspace and lockfile; `pnpm build` builds it into dist/apps/goldsim.
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-goldsim-${{ runner.os }}-${{ hashFiles('apps/goldsim/package-lock.json') }}
      - name: Install GoldSim dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/goldsim
      - name: Validate site content (sites/main/content/*.json against the schemas)
        run: pnpm content:check
      - name: Typecheck
        run: pnpm check
      - name: Test (workspaces that define tests)
        run: pnpm -r --if-present test
      - name: Build
        run: pnpm build
