name: Deploy to GitHub Pages

# Phase 1 only: publishes dev.team6220.org on every merge to main.
# Delete this file in Phase 2 when the site moves to Wix hosting.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # GoldSim keeps its own npm workspace and lockfile; `pnpm build` builds it into dist/apps/goldsim.
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-goldsim-${{ runner.os }}-${{ hashFiles('apps/goldsim/package-lock.json') }}
      - name: Install GoldSim dependencies
        run: npm ci --no-audit --no-fund
        working-directory: apps/goldsim
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
