name: Wix preview

# Phase 2: builds the site for Wix hosting and posts a hidden preview link on every pull request.
# Needs the `wix` environment's secrets (see https://github.com/Team-6220/team6220.org/wiki/History-Phase-2, "Preview link on every pull request").
# Pull requests from forks have no access to secrets, so they are skipped.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: wix-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: wix
    env:
      WIX_CLIENT_ID: ${{ secrets.WIX_CLIENT_ID }}
      WIX_CLIENT_INSTANCE_ID: ${{ secrets.WIX_CLIENT_INSTANCE_ID }}
      WIX_CLIENT_PUBLIC_KEY: ${{ secrets.WIX_CLIENT_PUBLIC_KEY }}
      WIX_CLIENT_SECRET: ${{ secrets.WIX_CLIENT_SECRET }}
    steps:
      # Until the `wix` environment has its secrets (https://github.com/Team-6220/team6220.org/wiki/History-Phase-2), skip quietly instead of failing the pull request.
      - name: Check for Wix secrets
        id: secrets
        run: |
          if [ -n "$WIX_API_KEY" ] && [ -n "$WIX_CLIENT_ID" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Wix secrets are not set up yet; skipping the preview."; fi
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ready == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24 # The Wix CLI needs Node 24.22.1 or newer
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.ready == 'true'
      # GoldSim keeps its own npm workspace; `pnpm wix build` builds it into dist/apps/goldsim.
      - name: Install GoldSim dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: apps/goldsim
      - name: Log in to Wix
        if: steps.secrets.outputs.ready == 'true'
        # A line break or other stray character pasted with the key makes Wix reject it ("Invalid character in header
        # content"), so keep only the characters a token is made of.
        run: |
          key=$(printf '%s' "$WIX_API_KEY" | tr -cd 'A-Za-z0-9._~+/=-')
          echo "API key length: ${#WIX_API_KEY} stored, ${#key} after cleaning"
          pnpm wix login --api-key "$key"
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
      # `wix preview` only uploads what is already built, so always build first.
      - run: pnpm wix build
        if: steps.secrets.outputs.ready == 'true'
      - name: Create the preview
        if: steps.secrets.outputs.ready == 'true'
        id: preview
        run: |
          pnpm wix preview 2>&1 | tee preview.log
          url=$(grep -Eo 'https://[^ )]+wix-site-host\.com[^ )]*' preview.log | head -n 1)
          if [ -z "$url" ]; then echo "No preview link found in the output above." >&2; exit 1; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the link on the pull request
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = "<!-- wix-preview -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n**Wix preview** (${sha}): ${process.env.PREVIEW_URL}\n\nHidden link for team testing. The server code stops after about 3 days; push again to refresh it.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
