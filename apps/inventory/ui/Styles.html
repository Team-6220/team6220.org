<style>
/* ============================================================================
   Styles.html — Golden Griffins Inventory
   Dark-only, industrial. All colors are tokens below; change them here only.
   team6220.org: greys and corner radius follow the official palette (packages/ui/src/tokens.css).
   ========================================================================== */
:root {
  --bg: #000000;
  --bg-1: #08080a;
  --panel: #111114;
  --panel-2: #17171b;
  --panel-3: #1e1e23;
  --line: #24242a;
  --line-2: #33333F;
  --text: #f5f5f6;
  --text-2: #C5C6CD;
  --muted: #80808a;
  --orange: #FFA300;
  --orange-2: #FA9504;
  --orange-ink: #1a1000;
  --orange-dim: rgba(255, 163, 0, 0.12);
  --orange-line: rgba(255, 163, 0, 0.45);
  --blue: #4054E4;
  --blue-dim: rgba(64, 84, 228, 0.18);
  --blue-text: #9aa6ff;
  --danger: #ff5c4d;
  --danger-dim: rgba(255, 92, 77, 0.12);
  --ok: #3fcf74;
  --white: #FFFFFF;

  --font-title: 'Karnivore Lite', 'Jura', sans-serif;
  --font-body: 'Jura', 'Segoe UI', system-ui, sans-serif;
  --font-label: 'Azoft Sans', 'Jura', sans-serif;

  --radius: 4px;
  --radius-lg: 4px;
  --sidebar-w: 252px;
  --sidebar-w-collapsed: 72px;
  --tap: 44px;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.6);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-weight: 500;
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
::selection { background: var(--blue); color: var(--white); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
svg.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ───────────────────────── App shell ───────────────────────── */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
.app.collapsed { grid-template-columns: var(--sidebar-w-collapsed) 1fr; }

.sidebar {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  background: var(--bg);
  border-right: 1px solid var(--line);
  overflow: hidden;
  z-index: 30;
}
.sidebar-brand { padding: 22px 20px 14px; border-bottom: 1px solid var(--line); }
.sidebar-brand .wings { display: block; width: 100%; max-width: 196px; height: auto; margin: 0 auto; }
.sidebar-brand .mark { display: none; width: 36px; height: 36px; margin: 0 auto; }
.sidebar-brand .wordmark {
  margin-top: 12px; text-align: center;
  font-family: var(--font-title); font-size: 15px; letter-spacing: 0.08em; color: var(--white);
}
.sidebar-brand .wordmark span { color: var(--orange); }
.nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
.nav-label {
  padding: 14px 12px 6px; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted);
}
.nav a {
  position: relative;
  display: flex; align-items: center; gap: 12px;
  min-height: 42px; padding: 0 12px; margin: 2px 0;
  border-radius: var(--radius);
  color: var(--text-2); text-decoration: none; font-weight: 600; letter-spacing: 0.01em;
  white-space: nowrap;
}
.nav a:hover { background: var(--panel-2); color: var(--text); }
.nav a.active { background: var(--orange-dim); color: var(--orange); }
.nav a.active::before {
  content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--orange);
}
.nav a .soon { margin-left: auto; font-size: 10px; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; }
.sidebar-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.save-status { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.save-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.save-status.saving .dot { background: var(--orange); }
.save-status.error .dot { background: var(--danger); }
.save-status.error { color: var(--danger); }
.collapse-btn {
  display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px;
  background: none; border: 0; border-radius: var(--radius); color: var(--muted); white-space: nowrap;
}
.collapse-btn:hover { background: var(--panel-2); color: var(--text); }

.app.collapsed .sidebar-brand { padding: 18px 10px 14px; }
.app.collapsed .sidebar-brand .wings,
.app.collapsed .sidebar-brand .wordmark,
.app.collapsed .nav-label,
.app.collapsed .nav a .label,
.app.collapsed .nav a .soon,
.app.collapsed .save-status .label,
.app.collapsed .collapse-btn .label { display: none; }
.app.collapsed .sidebar-brand .mark { display: block; }
.app.collapsed .nav a, .app.collapsed .collapse-btn, .app.collapsed .save-status { justify-content: center; padding: 0; }
.app.collapsed .collapse-btn svg { transform: rotate(180deg); }

.mobile-bar { display: none; }
.nav-scrim { display: none; }
.main { min-width: 0; min-height: 100vh; background: var(--bg-1); outline: none; }

/* ───────────────────────── Page ───────────────────────── */
.page { max-width: 1320px; margin: 0 auto; padding: 28px 32px 80px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.page-title {
  margin: 0; font-family: var(--font-title); font-weight: normal;
  font-size: 34px; line-height: 1.05; letter-spacing: 0.03em; color: var(--white);
}
.page-sub { margin-top: 6px; color: var(--muted); font-size: 13px; letter-spacing: 0.04em; }
.page-sub b { color: var(--text-2); font-weight: 600; }
.page-actions { display: flex; gap: 10px; align-items: center; }

/* ───────────────────────── Buttons & fields ───────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 40px; padding: 0 16px;
  border: 1px solid var(--line-2); border-radius: var(--radius);
  background: var(--panel-2); color: var(--text);
  font-weight: 600; letter-spacing: 0.02em; white-space: nowrap;
}
.btn:hover { border-color: #4E4A5B; background: var(--panel-3); }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.primary { background: var(--orange); border-color: var(--orange); color: var(--orange-ink); }
.btn.primary:hover { background: var(--orange-2); border-color: var(--orange-2); }
.btn.danger { color: var(--danger); border-color: rgba(255, 92, 77, 0.35); background: transparent; }
.btn.danger:hover { background: var(--danger-dim); }
.btn.danger-solid { background: var(--danger); border-color: var(--danger); color: #1a0200; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--panel-2); color: var(--text); }
.btn.sm { height: 32px; padding: 0 10px; font-size: 13px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 36px; height: 36px; padding: 0; border: 1px solid transparent; border-radius: var(--radius);
  background: transparent; color: var(--text-2);
}
.icon-btn:hover { background: var(--panel-3); color: var(--text); }
.icon-btn.danger:hover { color: var(--danger); background: var(--danger-dim); }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field-label {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600;
}
.field .req { color: var(--orange); }
.field .hint { font-size: 12px; color: var(--muted); }
.field .error { font-size: 12px; color: var(--danger); }
.input, .select, .textarea {
  width: 100%; min-height: 42px; padding: 9px 12px;
  background: var(--bg); border: 1px solid var(--line-2); border-radius: var(--radius);
  color: var(--text); font-weight: 500;
}
.textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.select { appearance: none; padding-right: 34px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 18px, calc(100% - 13px) 18px; background-size: 5px 5px; background-repeat: no-repeat; }
.select option, .select optgroup { background: var(--panel); color: var(--text); }
.input:hover, .select:hover, .textarea:hover { border-color: #4E4A5B; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim); }
.field.has-error .input, .field.has-error .select, .field.has-error .textarea { border-color: var(--danger); }
.link-btn { background: none; border: 0; padding: 0; color: var(--blue-text); font-size: 12px; font-weight: 600; }
.link-btn:hover { text-decoration: underline; }

/* ───────────────────────── Search ───────────────────────── */
.search {
  position: relative; display: flex; align-items: center;
  height: 56px; margin-bottom: 14px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius-lg);
}
.search:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim); }
.search > svg.icon { position: absolute; left: 18px; width: 20px; height: 20px; color: var(--muted); }
.search input {
  flex: 1; height: 100%; padding: 0 48px 0 52px; min-width: 0;
  background: transparent; border: 0; outline: none; font-size: 18px; font-weight: 500;
}
.search input::placeholder { color: var(--muted); }
.search .clear { position: absolute; right: 10px; }
.search kbd {
  position: absolute; right: 16px; padding: 2px 8px; border: 1px solid var(--line-2); border-radius: 4px;
  font-family: var(--font-body); font-size: 12px; color: var(--muted);
}

/* ───────────────────────── Filters ───────────────────────── */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 999px;
  color: var(--text-2); font-weight: 600; font-size: 13px; white-space: nowrap;
}
.pill:hover { border-color: #4E4A5B; color: var(--text); }
.pill.on { background: var(--orange-dim); border-color: var(--orange-line); color: var(--orange); }
.pill .count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius); background: var(--orange); color: var(--orange-ink); font-size: 12px; line-height: 20px; text-align: center; }
.pill svg.icon { width: 14px; height: 14px; }
.filters .spacer { flex: 1; }
.filters .sort { width: auto; min-height: 36px; height: 36px; padding: 0 34px 0 12px; font-size: 13px; background-position: calc(100% - 18px) 15px, calc(100% - 13px) 15px; }

.popover {
  position: fixed; z-index: 60; width: 300px; max-width: calc(100vw - 24px); max-height: min(440px, 70vh);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.popover-head { padding: 10px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
.popover-head .input { min-height: 36px; padding: 6px 10px; }
.popover-body { overflow-y: auto; padding: 6px; }
.popover-foot { padding: 8px 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.opt {
  display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 6px 10px;
  border: 0; border-radius: var(--radius); background: none; text-align: left; color: var(--text-2);
}
.opt:hover { background: var(--panel-3); color: var(--text); }
.opt .box { width: 18px; height: 18px; flex: none; border: 1.5px solid var(--line-2); border-radius: 4px; display: grid; place-items: center; }
.opt.checked { color: var(--text); }
.opt.checked .box { background: var(--orange); border-color: var(--orange); }
.opt.checked .box svg { stroke: var(--orange-ink); width: 13px; height: 13px; stroke-width: 3; }
.opt.indent { padding-left: 34px; }
.opt-group { padding: 10px 10px 4px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.opt-empty { padding: 14px 10px; color: var(--muted); font-size: 13px; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: var(--radius); overflow: hidden; }
.seg button { height: 30px; padding: 0 10px; border: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; }
.seg button.on { background: var(--orange-dim); color: var(--orange); }

/* ───────────────────────── Results table ───────────────────────── */
.results-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 2px 10px; font-size: 13px; color: var(--muted); }
.table { border: 1px solid var(--line); border-radius: var(--radius-lg); overflow: hidden; background: var(--panel); }
.row {
  display: grid; align-items: center; gap: 16px;
  grid-template-columns: minmax(0, 1fr) 130px 170px 140px 168px;
  min-height: 64px; padding: 10px 16px;
  border-top: 1px solid var(--line);
}
.row:first-child { border-top: 0; }
.row.head {
  min-height: 42px; padding-top: 0; padding-bottom: 0; background: var(--bg);
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted);
}
.row.head button { background: none; border: 0; padding: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; display: inline-flex; align-items: center; gap: 4px; }
.row.head button:hover, .row.head button.sorted { color: var(--text); }
.row.item { cursor: pointer; }
.row.item:hover { background: var(--panel-2); }
.row.item.low { box-shadow: inset 3px 0 0 var(--orange-2); }
.cell-name { min-width: 0; }
.item-name { font-weight: 700; color: var(--white); overflow-wrap: anywhere; }
.item-name mark { background: none; color: var(--orange); }
.item-sub { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; align-items: center; }
.cell { color: var(--text-2); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
.cell.empty { color: #4d4d56; }
.cell-qty { justify-self: end; display: flex; align-items: center; gap: 8px; }
.row .m-meta { display: none; }

.tag { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; background: var(--panel-3); color: var(--text-2); font-size: 12px; font-weight: 600; }
.badge { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 7px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.badge.low { background: rgba(250, 149, 4, 0.16); color: var(--orange-2); border: 1px solid rgba(250, 149, 4, 0.45); }
.badge.check { background: var(--blue-dim); color: var(--blue-text); border: 1px solid rgba(64, 84, 228, 0.55); }
.badge.archived { background: var(--panel-3); color: var(--muted); }

/* Quantity stepper */
.qty { display: inline-flex; align-items: stretch; height: 40px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--bg); overflow: hidden; }
.qty button { width: 40px; border: 0; background: transparent; color: var(--text-2); font-size: 20px; line-height: 1; display: grid; place-items: center; }
.qty button:hover { background: var(--panel-3); color: var(--orange); }
.qty button:active { background: var(--orange-dim); }
.qty .val {
  width: 64px; border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  font-size: 17px; font-weight: 700; color: var(--white); font-variant-numeric: tabular-nums;
}
.qty .val:hover { color: var(--white); background: var(--panel-2); }
.qty input.val { padding: 0 6px; text-align: center; background: var(--panel-2); outline: none; -moz-appearance: textfield; }
.qty input.val::-webkit-outer-spin-button, .qty input.val::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.qty.zero .val { color: var(--danger); }
.sync { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); }
.sync.pending::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--orange); }
.sync.saved { color: var(--ok); }
.sync svg.icon { width: 15px; height: 15px; stroke-width: 2.5; }

.more-row { display: flex; justify-content: center; padding: 14px; border-top: 1px solid var(--line); }

/* Empty & loading */
.empty-state { padding: 56px 24px; text-align: center; color: var(--muted); }
.empty-state .big { font-family: var(--font-title); font-size: 22px; color: var(--text); letter-spacing: 0.04em; margin-bottom: 8px; }
.empty-state p { margin: 0 auto 18px; max-width: 420px; }
.loading { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 80px 24px; color: var(--muted); }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--orange); animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ───────────────────────── Modal / drawer ───────────────────────── */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.66); display: flex; align-items: center; justify-content: center; padding: 16px; }
.scrim.drawer-scrim { justify-content: flex-end; padding: 0; }
.dialog {
  width: 440px; max-width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--radius-lg); box-shadow: var(--shadow);
}
.drawer {
  width: 520px; max-width: 100%; height: 100%; display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--line-2); box-shadow: var(--shadow);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.modal-title { margin: 0; font-family: var(--font-title); font-weight: normal; font-size: 22px; letter-spacing: 0.04em; }
.modal-body { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px; }
.modal-body p { margin: 0; color: var(--text-2); }
.modal-foot { display: flex; align-items: center; gap: 10px; padding: 14px 20px; border-top: 1px solid var(--line); }
.modal-foot .spacer { flex: 1; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-grid .full { grid-column: 1 / -1; }
.meta-line { font-size: 12px; color: var(--muted); }
.notice { padding: 12px 14px; border-radius: var(--radius); background: var(--blue-dim); border: 1px solid rgba(64, 84, 228, 0.5); color: var(--text); font-size: 14px; }
.notice.warn { background: var(--orange-dim); border-color: var(--orange-line); }

/* Tag picker */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 42px; padding: 6px; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--bg); cursor: text; }
.chips:focus-within { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-dim); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 4px 0 10px; border-radius: 4px; background: var(--panel-3); font-size: 13px; font-weight: 600; }
.chip button { width: 22px; height: 22px; border: 0; border-radius: 3px; background: none; color: var(--muted); display: grid; place-items: center; padding: 0; }
.chip button:hover { color: var(--danger); background: var(--danger-dim); }
.chip button svg.icon { width: 13px; height: 13px; }
.chips input { flex: 1; min-width: 120px; height: 28px; border: 0; background: transparent; outline: none; padding: 0 6px; }
.picker-list { position: relative; }
.picker-menu { margin-top: 6px; max-height: 230px; overflow-y: auto; border: 1px solid var(--line-2); border-radius: var(--radius); background: var(--panel-2); padding: 4px; }
.picker-menu .opt.active { background: var(--panel-3); color: var(--text); }

/* Toasts */
#toasts { position: fixed; z-index: 80; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast {
  pointer-events: auto; display: flex; align-items: center; gap: 12px; max-width: 420px;
  padding: 12px 14px; border-radius: var(--radius); background: var(--panel-3); border: 1px solid var(--line-2);
  box-shadow: var(--shadow); font-size: 14px;
}
.toast.error { border-color: rgba(255, 92, 77, 0.6); }
.toast.error::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); flex: none; }
.toast.ok::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.toast .link-btn { font-size: 13px; color: var(--orange); }

/* ───────────────────────── Settings ───────────────────────── */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 22px; overflow-x: auto; scrollbar-width: none; }
.tabs button {
  position: relative; height: 44px; padding: 0 14px; border: 0; background: none; color: var(--muted);
  font-weight: 700; letter-spacing: 0.02em; white-space: nowrap;
}
.tabs button:hover { color: var(--text); }
.tabs button.on { color: var(--orange); }
.tabs button.on::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; background: var(--orange); }
.settings-grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 28px; align-items: start; }
.settings-help { padding: 16px; border: 1px dashed var(--line-2); border-radius: var(--radius-lg); color: var(--muted); font-size: 13px; }
.settings-help h3 { margin: 0 0 8px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-2); }
.settings-help p { margin: 0 0 8px; }

/* Low-stock panel */

.low-head { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; padding: 0 14px; border: 0; background: none; color: var(--text-2); font-size: 14px; text-align: left; }

/* Audits */

.badge.ok { background: rgba(63, 207, 116, 0.12); color: var(--ok); border: 1px solid rgba(63, 207, 116, 0.4); }

/* Packing list */

.pgroup-head { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px 6px 12px; }
.group-card.pgroup > .pgroup-head { background: var(--bg); }
.pgroup-title { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 4px 0; border: 0; background: none; text-align: left; }

.pgroup-body { border-top: 1px solid var(--line); }
/* A sub-group lines up with the single items beside it; only its contents are indented. */

.pack-list .pgroup > .pleaf { flex-wrap: wrap; }
.pcheck { width: 30px; height: 30px; flex: none; display: grid; place-items: center; padding: 0; border: 2px solid var(--line-2); border-radius: var(--radius); background: var(--bg); color: var(--orange-ink); }
